<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clash Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #141b3f; --navy-2: #222a55; --green: #00b261; --ink: #333333;
    --muted: #58595b; --line: #e3e4e8; --bg: #ffffff; --panel: #f6f7f9;
    --high: #d64045; --medium: #e8912d; --low: #2f80c4; --info: #8a8d96;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: Inter, Arial, sans-serif; color: var(--ink); background: var(--bg); font-size: 13.5px;
         display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; align-items: center; gap: 18px; padding: 14px 24px; border-bottom: 2px solid var(--line); }
  .mark { width: 34px; height: 34px; border-radius: 7px; background: var(--navy); position: relative; flex: none; }
  .mark::after { content: ""; position: absolute; right: 5px; top: 5px; width: 13px; height: 24px; background: var(--green); border-radius: 0 4px 4px 0; }
  .brand { line-height: 1.05; color: var(--navy); }
  .brand b { display: block; font-size: 17px; font-weight: 600; }
  .brand span { font-size: 15px; }
  nav { margin-left: 28px; display: flex; gap: 28px; text-transform: uppercase; font-weight: 600; font-size: 13px; color: var(--muted); }
  nav .on { color: var(--navy); border-bottom: 2px solid var(--navy); padding-bottom: 14px; margin-bottom: -16px; }
  .right { margin-left: auto; display: flex; gap: 12px; align-items: center; }
  select, input[type=search] { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 0; color: var(--navy); background: #fff; }
  .btn { font: inherit; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: .04em; padding: 9px 14px;
         background: var(--navy); color: #fff; border: 0; cursor: pointer; text-decoration: none; }
  .btn.green { background: var(--green); }
  main { display: grid; grid-template-columns: 420px 1fr; min-height: 0; }
  aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
  .sect { padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #9a9ca3; margin-bottom: 8px; }
  .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .chip { background: #fff; border: 1px solid var(--line); border-top: 4px solid var(--c); padding: 8px; cursor: pointer; text-align: left; font: inherit; }
  .chip .n { font-size: 20px; font-weight: 700; color: var(--navy); display: block; }
  .chip .l { font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: .05em; }
  .chip.off { opacity: .4; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row > * { flex: 1; min-width: 0; }
  .toggles { display: flex; gap: 14px; flex-wrap: wrap; }
  .toggles label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .sw { width: 12px; height: 12px; display: inline-block; }
  #list { overflow: auto; flex: 1; min-height: 160px; }
  .layers { max-height: 230px; overflow: auto; background: #fff; border: 1px solid var(--line); }
  .lyr { display: flex; align-items: center; gap: 7px; padding: 5px 8px; border-bottom: 1px solid var(--line); }
  .lyr.file { background: #eef0f4; font-weight: 600; color: var(--navy); }
  .lyr.cat { padding-left: 26px; }
  .lyr .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .lyr .nm:hover { color: var(--green); }
  .lyr .ct { color: #9a9ca3; font-size: 12px; }
  .lyr.iso { outline: 2px solid var(--green); outline-offset: -2px; }
  .lyr .tw { cursor: pointer; width: 12px; color: var(--muted); }
  .mini { font: inherit; font-size: 11px; font-weight: 600; text-transform: uppercase; padding: 4px 8px; background: #fff; border: 1px solid var(--line); color: var(--navy); cursor: pointer; }
  .mini.on { background: var(--navy); color: #fff; }
  .sec { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .sec input[type=range] { flex: 1; accent-color: var(--green); }
  .item { padding: 11px 18px; border-bottom: 1px solid var(--line); cursor: pointer; background: #fff; border-left: 4px solid var(--c); }
  .item:hover { background: #f0f6f3; }
  .item.sel { background: #e6f6ee; outline: 1px solid var(--green); }
  .item .top { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .item .id { font-weight: 700; color: var(--navy); }
  .sev { font-weight: 700; text-transform: uppercase; font-size: 11px; color: var(--c); }
  .item .d { margin-top: 3px; color: var(--ink); }
  .more { padding: 12px; text-align: center; }
  #stage { position: relative; min-height: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #card { position: absolute; right: 16px; bottom: 16px; width: 380px; background: #fff; box-shadow: 0 6px 24px rgba(20,27,63,.18);
          display: none; }
  #card h3 { margin: 0; padding: 16px 18px; background: var(--navy); color: #fff; font-weight: 600; font-size: 17px; display: flex; justify-content: space-between; }
  #card .body { padding: 14px 18px; }
  #card dl { display: grid; grid-template-columns: 92px 1fr; gap: 5px 10px; margin: 10px 0 0; font-size: 12.5px; }
  #card dt { color: var(--muted); }
  #card dd { margin: 0; color: var(--navy); word-break: break-word; }
  .action { margin-top: 10px; padding: 9px 11px; background: #e6f6ee; border-left: 3px solid var(--green); }
  #legend { position: absolute; left: 16px; top: 16px; background: rgba(255,255,255,.92); padding: 10px 12px; font-size: 12px; }
  #legend div { display: flex; align-items: center; gap: 7px; margin: 3px 0; }
  #hint { position: absolute; left: 16px; bottom: 16px; font-size: 11.5px; color: var(--muted); background: rgba(255,255,255,.85); padding: 6px 10px; pointer-events: none; }
  @media (hover: none) { #hint { display: none; } }
  #tools { position: absolute; top: 16px; right: 16px; display: flex; background: #fff; box-shadow: 0 2px 10px rgba(20,27,63,.15); z-index: 2; }
  #tools button { font: inherit; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; border: 0; background: #fff; color: var(--navy); padding: 9px 13px; cursor: pointer; border-right: 1px solid var(--line); }
  #tools button:last-child { border-right: 0; }
  #tools button.on { background: var(--navy); color: #fff; }
  #info { position: absolute; top: 60px; right: 16px; width: 320px; background: #fff; box-shadow: 0 6px 24px rgba(20,27,63,.18); display: none; z-index: 2; font-size: 12.5px; }
  #info h4 { margin: 0; padding: 10px 14px; background: #2f80c4; color: #fff; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
  #info dl { display: grid; grid-template-columns: 78px 1fr; gap: 4px 10px; margin: 0; padding: 10px 14px; }
  #info dt { color: var(--muted); } #info dd { margin: 0; color: var(--navy); word-break: break-word; }
  #info .cl { padding: 0 14px 12px; display: flex; flex-wrap: wrap; gap: 5px; }
  #info .cl button { font: inherit; font-size: 11.5px; border: 1px solid var(--line); background: #fff; color: var(--navy); padding: 3px 7px; cursor: pointer; border-left: 3px solid var(--c); }
  .mlabel { position: absolute; transform: translate(-50%, -50%); background: var(--navy); color: #fff; font-size: 12px; font-weight: 600; padding: 4px 8px; pointer-events: none; white-space: nowrap; z-index: 1; }
  .mlabel small { font-weight: 400; opacity: .75; margin-left: 6px; }
  #stage.measure canvas, #stage.identify canvas { cursor: crosshair !important; }
  @media (max-width: 900px) { #info { left: 8px; right: 8px; width: auto; top: 54px; } #tools { right: 8px; top: 8px; } }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(255,255,255,.85); font-weight: 600; color: var(--navy); }
  .x { cursor: pointer; opacity: .8; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-rows: 50vh 1fr; } aside { order: 2; } nav { display: none; } #card { width: auto; left: 16px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<header>
  <div class="mark"></div>
  <div class="brand"><b>Team</b><span>Engineering</span></div>
  <nav><span class="on">Clash Review</span><span>Structural</span><span>MEP</span></nav>
  <div class="right">
    <select id="project"></select>
    <a id="csv" class="btn green" download>Download CSV</a>
  </div>
</header>
<main>
  <aside>
    <div class="sect">
      <div class="eyebrow">Conflicts by severity</div>
      <div class="chips" id="chips"></div>
      <div class="row">
        <select id="type"><option value="">All clash types</option></select>
        <input id="q" type="search" placeholder="Search level, type, ID…">
      </div>
    </div>
    <div class="sect">
      <div class="eyebrow" style="display:flex;justify-content:space-between">Section cut <span id="secVal"></span></div>
      <div class="sec">
        <button class="mini on" data-ax="">Off</button><button class="mini" data-ax="y">Plan</button><button class="mini" data-ax="x">E–W</button><button class="mini" data-ax="z">N–S</button>
        <button class="mini" id="secFlip" title="Flip which side is kept">⇅ Flip</button>
      </div>
      <div class="sec"><input type="range" id="secPos" min="0" max="1000" value="500" disabled></div>
    </div>
    <div class="sect">
      <div class="eyebrow" style="display:flex;justify-content:space-between">Layers <span><button class="mini" id="lyrAll">Show all</button></span></div>
      <div class="layers" id="layers"></div>
      <div style="font-size:11.5px;color:#9a9ca3;margin-top:5px">Tick to show/hide. Click a name to isolate it; click again to show everything.</div>
    </div>
    <div id="list"></div>
  </aside>
  <section id="stage">
    <div id="legend"></div>
    <div id="card"><h3><span id="cTitle"></span><span class="x" id="cClose">✕</span></h3><div class="body" id="cBody"></div></div>
    <div id="tools"><button data-tool="nav" class="on" title="Navigate (N)">Navigate</button><button data-tool="identify" title="Identify (I)">Identify</button><button data-tool="measure" title="Measure (M)">Measure</button><button id="mClear" title="Clear measurements">Clear</button></div>
    <div id="info"><h4><span id="iTitle"></span><span class="x" id="iClose">✕</span></h4><dl id="iBody"></dl><div class="cl" id="iClashes"></div></div>
    <div id="hint">Drag to orbit · Right/middle-drag to pan · Scroll or pinch to zoom · H to reset</div>
    <div id="loading">Loading models…</div>
  </section>
</main>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const SEV = { High: "--high", Medium: "--medium", Low: "--low", Info: "--info" };
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const DISC = { ARCH: { label: "Architectural", color: 0xc9ccd6 }, STRUCT: { label: "Structural", color: 0x141b3f }, MEP: { label: "MEP", color: 0x00b261 } };
const HIT_A = 0xe8912d, HIT_B = 0xd64045;

const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true });
// Coincident faces (duplicates across models, finish layers) flicker when the
// renderer re-sorts transparent objects each frame; keep a fixed draw order.
renderer.sortObjects = false;
renderer.setPixelRatio(devicePixelRatio);
renderer.setClearColor(0xffffff);
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 500);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.085;
controls.rotateSpeed = 0.55;
controls.panSpeed = 0.9;
controls.screenSpacePanning = true;
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.PAN };
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
// Wheel/trackpad is intercepted below (smooth zoom-to-cursor); touch pinch stays with OrbitControls.
scene.add(new THREE.HemisphereLight(0xffffff, 0x8890a8, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(30, 60, 20); scene.add(sun);
const marker = new THREE.Mesh(new THREE.SphereGeometry(0.12, 24, 16), new THREE.MeshBasicMaterial({ color: HIT_B, depthTest: false, transparent: true, opacity: .85 }));
marker.renderOrder = 10; marker.visible = false; scene.add(marker);

function resize() { const r = stage.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage);
// ---- Motion: eased fly-to, inertial zoom-to-cursor, trackpad pan ----
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
let flight = null, zoomVel = 0, zoomPt = new THREE.Vector3(), panVel = new THREE.Vector2();
function flyTo(target, position, ms = 750) {
  flight = { t0: performance.now(), ms, ft: controls.target.clone(), fp: camera.position.clone(), tt: target.clone(), tp: position.clone() };
  zoomVel = 0; panVel.set(0, 0);
}
const ndc = new THREE.Vector2(), ray = new THREE.Raycaster();
function pointUnderCursor(e) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(Object.values(meshes).filter(m => m.visible), false)
    .find(h => !secAxis || clip.distanceToPoint(h.point) >= 0);
  if (hit) return hit.point;
  // Nothing under the cursor: use the point at the orbit target's depth.
  const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(camera.getWorldDirection(new THREE.Vector3()), controls.target);
  return ray.ray.intersectPlane(plane, new THREE.Vector3()) || controls.target.clone();
}
stage.addEventListener("wheel", e => {
  if (e.target !== renderer.domElement) return;
  e.preventDefault(); e.stopPropagation();
  flight = null;
  const px = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1;
  const isTrackpadPan = !e.ctrlKey && e.deltaMode === 0 && Math.abs(e.deltaX) > 0;
  if (isTrackpadPan) { panVel.x += e.deltaX * .0016; panVel.y += e.deltaY * .0016; return; }
  zoomPt.copy(pointUnderCursor(e));
  // Pinch (ctrlKey) sends small deltas; amplify so it tracks the fingers.
  zoomVel += -e.deltaY * px * (e.ctrlKey ? .012 : .0018);
  zoomVel = THREE.MathUtils.clamp(zoomVel, -1.2, 1.2);
}, { passive: false, capture: true });
const cam2tgt = new THREE.Vector3(), right = new THREE.Vector3(), up = new THREE.Vector3();
let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min((now - last) / 16.67, 3); last = now;
  if (flight) {
    const t = Math.min((now - flight.t0) / flight.ms, 1), k = ease(t);
    controls.target.lerpVectors(flight.ft, flight.tt, k);
    camera.position.lerpVectors(flight.fp, flight.tp, k);
    if (t === 1) flight = null;
  }
  if (Math.abs(zoomVel) > 1e-4) {
    // Scale camera and target about the cursor point: zooms "into" what you point at.
    const f = Math.exp(-zoomVel * .16 * dt);
    const d = camera.position.distanceTo(zoomPt);
    if (!(zoomVel > 0 && d * f < .25)) {
      camera.position.sub(zoomPt).multiplyScalar(f).add(zoomPt);
      controls.target.sub(zoomPt).multiplyScalar(f).add(zoomPt);
    }
    zoomVel *= Math.pow(.84, dt);
  }
  if (panVel.lengthSq() > 1e-8) {
    const dist = camera.position.distanceTo(controls.target);
    right.setFromMatrixColumn(camera.matrix, 0); up.setFromMatrixColumn(camera.matrix, 1);
    cam2tgt.copy(right).multiplyScalar(panVel.x * dist * .16 * dt).addScaledVector(up, -panVel.y * dist * .16 * dt);
    camera.position.add(cam2tgt); controls.target.add(cam2tgt);
    panVel.multiplyScalar(Math.pow(.84, dt));
  }
  controls.update();
  // Keep the depth range tight around what is on screen for better precision.
  const dist = camera.position.distanceTo(controls.target);
  const near = THREE.MathUtils.clamp(dist / 400, .02, 1), far = Math.max(dist * 40, 200);
  if (Math.abs(camera.near - near) / near > .1 || camera.far !== far) { camera.near = near; camera.far = far; camera.updateProjectionMatrix(); }
  updateMeasureLabels();
  renderer.render(scene, camera);
});
// Grab cursor feedback.
const cv = renderer.domElement;
cv.style.cursor = "grab"; cv.style.touchAction = "none";
cv.addEventListener("pointerdown", e => { flight = null; cv.style.cursor = e.button === 0 && !e.shiftKey ? "grabbing" : "move"; });
addEventListener("pointerup", () => cv.style.cursor = "grab");
cv.addEventListener("contextmenu", e => e.preventDefault());

let data, groups = {}, meshes = {}, filtered = [], shown = 200, selected = null;
const filters = { sev: new Set(["High", "Medium", "Low"]), type: "", q: "" };
const mats = {};
// Polygon offset per layer so coincident faces resolve the same way every frame:
// highlights win, then MEP, structure, architecture.
const OFFSET = { A: -3, B: -3, pick: -4, MEP: -1, STRUCT: 0, ARCH: 1 };
function mat(key, color, opacity = 1) {
  const off = OFFSET[key] ?? OFFSET[key.replace("ghost", "")] ?? 0;
  return mats[key] ??= new THREE.MeshStandardMaterial({ color, roughness: .8, metalness: 0, transparent: opacity < 1, opacity, depthWrite: opacity === 1, side: THREE.DoubleSide,
    polygonOffset: off !== 0, polygonOffsetFactor: off, polygonOffsetUnits: off * 2 });
}

async function loadProject(slug) {
  document.getElementById("loading").style.display = "grid";
  Object.values(groups).forEach(g => scene.remove(g)); groups = {}; meshes = {};
  data = await (await fetch(`data/${slug}.json`)).json();
  document.getElementById("csv").href = `data/${data.csv}`;
  const loader = new GLTFLoader();
  await Promise.all(Object.entries(data.glb).map(async ([d, file]) => {
    const gltf = await loader.loadAsync(`data/${file}`);
    gltf.scene.traverse(o => { if (o.isMesh) { o.geometry.deleteAttribute("normal"); o.geometry.computeVertexNormals(); const guid = (o.parent?.name && data.elements[o.parent.name]) ? o.parent.name : o.name; o.userData.guid = guid; o.userData.disc = d; o.userData.kind = data.elements[guid]?.kind || (/^ctx_\d+$/.test(guid) ? data.ctx_kinds[+guid.slice(4)] : "Other"); meshes[guid] = o; } });
    groups[d] = gltf.scene; scene.add(gltf.scene);
  }));
  const box = new THREE.Box3(); Object.values(groups).forEach(g => box.expandByObject(g));
  const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3()).length();
  home = { t: c.clone(), p: c.clone().add(new THREE.Vector3(s * .6, s * .45, s * .6)) };
  if (!controls.target.lengthSq()) { controls.target.copy(home.t); camera.position.copy(home.p).multiplyScalar(1.15); }
  flyTo(home.t, home.p, 900);
  bounds = box; layerOff = new Set(); isolated = null; setSection("");
  scene.add(marker, mGroup, hover);   // overlays draw last (sortObjects is off)
  picked = null; clearMeasures?.(); document.getElementById("info").style.display = "none";
  buildFilters(); buildLayers(); select(null); applyFilters();
  document.getElementById("loading").style.display = "none";
}
let home, bounds, layerOff = new Set(), isolated = null;

// ---- Layers: one entry per source file, with its element categories ----
function layerKey(m) { return m.userData.disc + "|" + m.userData.kind; }
function applyVisibility() {
  for (const m of Object.values(meshes)) {
    const k = layerKey(m), d = m.userData.disc;
    const iso = !isolated || isolated === k || isolated === d;
    m.visible = iso && !layerOff.has(d) && !layerOff.has(k);
  }
  renderLayers();
}
function buildLayers() {
  layerTree = {};
  for (const m of Object.values(meshes)) {
    const d = m.userData.disc, k = m.userData.kind;
    (layerTree[d] ??= {})[k] = ((layerTree[d][k]) || 0) + 1;
  }
  open = new Set();
  renderLayers();
}
let layerTree = {}, open = new Set();
const hex = c => "#" + c.toString(16).padStart(6, "0");
function renderLayers() {
  const fileName = d => data.models.find(m => m.disc === d)?.file.replace(/\.ifc$/i, "") || DISC[d].label;
  const html = [];
  for (const d of Object.keys(layerTree)) {
    const cats = Object.entries(layerTree[d]).sort((a, b) => a[0].localeCompare(b[0]));
    const n = cats.reduce((s, [, c]) => s + c, 0);
    html.push(`<div class="lyr file ${isolated === d ? "iso" : ""}"><span class="tw" data-open="${d}">${open.has(d) ? "▾" : "▸"}</span>
      <input type="checkbox" data-k="${d}" ${layerOff.has(d) ? "" : "checked"}><span class="sw" style="background:${hex(DISC[d].color)}"></span>
      <span class="nm" data-iso="${d}" title="${fileName(d)}">${fileName(d)}</span><span class="ct">${n}</span></div>`);
    if (open.has(d)) for (const [k, c] of cats) {
      const key = d + "|" + k;
      html.push(`<div class="lyr cat ${isolated === key ? "iso" : ""}"><input type="checkbox" data-k="${key}" ${layerOff.has(key) ? "" : "checked"}>
        <span class="nm" data-iso="${key}">${k}</span><span class="ct">${c}</span></div>`);
    }
  }
  const el = document.getElementById("layers");
  el.innerHTML = html.join("");
  el.querySelectorAll("[data-open]").forEach(t => t.onclick = () => { const d = t.dataset.open; open.has(d) ? open.delete(d) : open.add(d); renderLayers(); });
  el.querySelectorAll("input[data-k]").forEach(i => i.onchange = () => { i.checked ? layerOff.delete(i.dataset.k) : layerOff.add(i.dataset.k); applyVisibility(); });
  el.querySelectorAll("[data-iso]").forEach(n => n.onclick = () => { isolated = isolated === n.dataset.iso ? null : n.dataset.iso; if (isolated) layerOff.clear(); applyVisibility(); });
}
document.getElementById("lyrAll").onclick = () => { isolated = null; layerOff.clear(); applyVisibility(); };

// ---- Section cut: one clipping plane along a chosen axis ----
const clip = new THREE.Plane();
let secAxis = "", secFlip = false;
renderer.localClippingEnabled = false;
function setSection(ax) {
  secAxis = ax;
  document.querySelectorAll("[data-ax]").forEach(b => b.classList.toggle("on", b.dataset.ax === ax));
  document.getElementById("secPos").disabled = !ax;
  renderer.clippingPlanes = ax ? [clip] : [];
  updateSection();
}
function updateSection() {
  const out = document.getElementById("secVal");
  if (!secAxis || !bounds) { out.textContent = ""; return; }
  const t = document.getElementById("secPos").value / 1000;
  const lo = bounds.min[secAxis], hi = bounds.max[secAxis], v = lo + (hi - lo) * t;
  const n = new THREE.Vector3(); n[secAxis] = secFlip ? 1 : -1;
  clip.set(n, secFlip ? -v : v);           // keeps the side n·p + c >= 0
  const ft = (secAxis === "z" ? -v : v) * 3.28084, s = ft < 0 ? "-" : "", a = Math.abs(ft);
  out.textContent = `${s}${Math.floor(a)}'-${((a % 1) * 12).toFixed(0)}"`;
}
document.querySelectorAll("[data-ax]").forEach(b => b.onclick = () => setSection(b.dataset.ax));
document.getElementById("secPos").oninput = updateSection;
document.getElementById("secFlip").onclick = e => { secFlip = !secFlip; e.target.classList.toggle("on", secFlip); updateSection(); };
// Jump the section to the selected clash so it is cut open.
function sectionAt(p) { if (!secAxis) return; const lo = bounds.min[secAxis], hi = bounds.max[secAxis]; document.getElementById("secPos").value = Math.round(((p[secAxis] - lo) / (hi - lo) + (secFlip ? -.002 : .002)) * 1000); updateSection(); }

function paint() {
  const a = selected && selected.a, parts = new Set(selected ? [selected.b, ...(selected.parts || [])] : []);
  for (const [guid, m] of Object.entries(meshes)) {
    const d = m.userData.disc;
    if (!selected) m.material = mat(d, DISC[d].color, d === "ARCH" ? .35 : 1);
    else if (guid === a) m.material = mat("A", HIT_A);
    else if (parts.has(guid)) m.material = mat("B", HIT_B);
    else m.material = mat("ghost" + d, DISC[d].color, .05);
    if (guid === picked) m.material = mat("pick", 0x2f80c4);
    m.renderOrder = selected && (guid === a || parts.has(guid)) ? 5 : 0;
  }
}

function buildFilters() {
  const counts = { High: 0, Medium: 0, Low: 0, Info: 0 };
  data.clashes.forEach(c => counts[c.severity]++);
  document.getElementById("chips").innerHTML = Object.keys(SEV).map(s =>
    `<button class="chip ${filters.sev.has(s) ? "" : "off"}" data-s="${s}" style="--c:var(${SEV[s]})"><span class="n">${counts[s]}</span><span class="l">${s}</span></button>`).join("");
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => { const s = b.dataset.s; filters.sev.has(s) ? filters.sev.delete(s) : filters.sev.add(s); b.classList.toggle("off"); applyFilters(); });
  const types = [...new Set(data.clashes.map(c => c.type))].sort();
  document.getElementById("type").innerHTML = `<option value="">All clash types</option>` + types.map(t => `<option>${t}</option>`).join("");
  document.getElementById("legend").innerHTML = Object.entries(DISC).map(([, v]) => `<div><span class="sw" style="background:#${v.color.toString(16).padStart(6, "0")}"></span>${v.label}</div>`).join("") +
    `<div><span class="sw" style="background:#e8912d"></span>Clash element A</div><div><span class="sw" style="background:#d64045"></span>Clash element B</div>`;
}

function label(guid) { const e = data.elements[guid]; return e ? `${e.kind}${e.type ? " · " + e.type : ""}` : guid; }

function applyFilters() {
  const q = filters.q.toLowerCase();
  filtered = data.clashes.filter(c => filters.sev.has(c.severity) && (!filters.type || c.type === filters.type) &&
    (!q || `${c.id} ${c.desc} ${c.level} ${c.type} ${label(c.a)} ${label(c.b)}`.toLowerCase().includes(q)));
  shown = 200; renderList();
}

function renderList() {
  const el = document.getElementById("list");
  el.innerHTML = filtered.slice(0, shown).map(c => `
    <div class="item ${selected?.id === c.id ? "sel" : ""}" data-id="${c.id}" style="--c:var(${SEV[c.severity]})">
      <div class="top"><span><span class="id">${c.id}</span> · ${c.level || "No level"}</span><span class="sev">${c.severity}</span></div>
      <div class="d">${c.desc}</div>
      <div class="top" style="margin-top:3px"><span>${c.type}</span><span>${c.depth_in}" overlap</span></div>
    </div>`).join("") + (filtered.length > shown ? `<div class="more"><button class="btn" id="more">Show more (${filtered.length - shown})</button></div>` : "")
    + (!filtered.length ? `<div class="more">No conflicts match these filters.</div>` : "");
  el.querySelectorAll(".item").forEach(i => i.onclick = () => select(data.clashes.find(c => c.id === i.dataset.id)));
  document.getElementById("more")?.addEventListener("click", () => { shown += 200; renderList(); });
}

function select(c) {
  selected = c; paint();
  document.querySelectorAll(".item").forEach(i => i.classList.toggle("sel", c && i.dataset.id === c.id));
  const card = document.getElementById("card");
  if (!c && bounds) applyVisibility();
  if (!c) { card.style.display = "none"; marker.visible = false; if (home) flyTo(home.t, home.p); return; }
  const A = data.elements[c.a], B = data.elements[c.b], dn = d => DISC[d]?.label || d;
  document.getElementById("cTitle").textContent = `${c.id} · ${c.severity}`;
  document.getElementById("cBody").innerHTML = `<div style="font-weight:600;color:var(--navy)">${c.type}</div><div>${c.desc}</div>
    <div class="action">${c.action}</div>
    <dl><dt>Level</dt><dd>${c.level || "–"}</dd><dt>Overlap</dt><dd>${c.depth_in}"</dd>
    <dt style="color:#e8912d">A · ${dn(A.disc)}</dt><dd>${A.kind} · ${A.type || A.name}${A.revit_id ? ` <small>(ID ${A.revit_id})</small>` : ""}</dd>
    <dt style="color:#d64045">B · ${dn(B.disc)}</dt><dd>${B.kind} · ${B.type || B.name}${B.revit_id ? ` <small>(ID ${B.revit_id})</small>` : ""}${c.parts.length > 1 ? ` +${c.parts.length - 1} connected part(s)` : ""}</dd></dl>`;
  card.style.display = "block";
  const p = new THREE.Vector3(...c.point); marker.position.copy(p); marker.visible = true;
  [c.a, ...c.parts].forEach(g => meshes[g] && (meshes[g].visible = true));
  sectionAt(p);
  const box = new THREE.Box3(); [c.a, c.b].forEach(g => meshes[g] && box.expandByObject(meshes[g]));
  const r = Math.min(Math.max(box.getSize(new THREE.Vector3()).length() * .5, 1.5), 8);
  const dir = camera.position.clone().sub(controls.target).normalize();
  flyTo(p, p.clone().addScaledVector(dir, r * 2.5));
}

renderer.domElement.addEventListener("dblclick", e => {
  const r = renderer.domElement.getBoundingClientRect(), ray = new THREE.Raycaster();
  ray.setFromCamera(new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);
  const hit = ray.intersectObjects(Object.values(meshes).filter(m => m.visible), false).find(h => !secAxis || clip.distanceToPoint(h.point) >= 0);
  const guid = hit?.object.userData.guid;
  if (!guid) return;
  const c = filtered.find(c => c.a === guid || c.parts.includes(guid)) || data.clashes.find(c => c.a === guid || c.parts.includes(guid));
  if (c) { select(c); document.querySelector(`.item[data-id="${c.id}"]`)?.scrollIntoView({ block: "center" }); }
});
document.getElementById("cClose").onclick = () => select(null);

// ---- Tools: navigate / identify / measure ----
let tool = "nav", picked = null;
function setTool(t) {
  tool = t;
  document.querySelectorAll("[data-tool]").forEach(b => b.classList.toggle("on", b.dataset.tool === t));
  stage.classList.toggle("measure", t === "measure"); stage.classList.toggle("identify", t === "identify");
  pending = null; hover.visible = false;
  if (t !== "identify") pick(null);
}
document.querySelectorAll("[data-tool]").forEach(b => b.onclick = () => setTool(b.dataset.tool));

function raycastAt(cx, cy) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  return ray.intersectObjects(Object.values(meshes).filter(m => m.visible), false)
    .find(h => !secAxis || clip.distanceToPoint(h.point) >= 0);
}
function toScreen(v) { const r = renderer.domElement.getBoundingClientRect(), p = v.clone().project(camera); return { x: (p.x + 1) / 2 * r.width, y: (1 - p.y) / 2 * r.height, z: p.z }; }

// Identify
function pick(guid) {
  picked = guid; paint();
  const box = document.getElementById("info");
  if (!guid) { box.style.display = "none"; return; }
  const m = meshes[guid], e = data.elements[guid], d = m?.userData.disc;
  const file = data.models.find(x => x.disc === d)?.file || "";
  const merged = /^ctx_\d+$/.test(guid);
  document.getElementById("iTitle").textContent = e ? `${e.kind}` : `${m.userData.kind}${merged ? " (merged)" : ""}`;
  const rows = [["Source", file], ["Discipline", DISC[d]?.label], ["Category", e?.kind || m.userData.kind]];
  if (e) rows.push(["Type", e.type], ["Name", e.name], ["Level", e.level], ["Revit ID", e.revit_id], ["GUID", guid]);
  else if (merged) rows.push(["Note", "Low-res view: elements not in a clash are merged by category."]);
  document.getElementById("iBody").innerHTML = rows.filter(r => r[1]).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
  const cl = data.clashes.filter(c => c.a === guid || c.b === guid || c.parts.includes(guid));
  document.getElementById("iClashes").innerHTML = cl.length ? `<div style="width:100%;color:var(--muted)">${cl.length} clash${cl.length > 1 ? "es" : ""}</div>` +
    cl.slice(0, 12).map(c => `<button data-c="${c.id}" style="--c:var(${SEV[c.severity]})">${c.id}</button>`).join("") + (cl.length > 12 ? `<span>+${cl.length - 12}</span>` : "") : `<div style="color:var(--muted)">No clashes on this element.</div>`;
  document.querySelectorAll("#iClashes [data-c]").forEach(b => b.onclick = () => { const c = data.clashes.find(x => x.id === b.dataset.c); setTool("nav"); select(c); document.querySelector(`.item[data-id="${c.id}"]`)?.scrollIntoView({ block: "center" }); });
  box.style.display = "block";
}
document.getElementById("iClose").onclick = () => pick(null);

// Measure: click two points; snaps to a corner of the face under the cursor.
const measures = [], mGroup = new THREE.Group(); scene.add(mGroup);
const dotGeo = new THREE.SphereGeometry(1, 16, 12);
const mMat = new THREE.MeshBasicMaterial({ color: 0x00b261, depthTest: false, transparent: true });
const lMat = new THREE.LineBasicMaterial({ color: 0x00a058, depthTest: false, transparent: true, linewidth: 2 });
const hover = new THREE.Mesh(dotGeo, new THREE.MeshBasicMaterial({ color: 0x00b261, depthTest: false, transparent: true, opacity: .6 }));
hover.visible = false; scene.add(hover);
let pending = null;
function dot(p) { const m = new THREE.Mesh(dotGeo, mMat); m.position.copy(p); m.userData.dot = true; mGroup.add(m); return m; }
function snapPoint(h, cx, cy) {
  if (!h.face) return h.point.clone();
  const pos = h.object.geometry.attributes.position, best = { d: 14, p: null };
  for (const i of [h.face.a, h.face.b, h.face.c]) {
    const v = new THREE.Vector3().fromBufferAttribute(pos, i).applyMatrix4(h.object.matrixWorld);
    const s = toScreen(v), r = renderer.domElement.getBoundingClientRect();
    const d = Math.hypot(s.x + r.left - cx, s.y + r.top - cy);
    if (d < best.d) { best.d = d; best.p = v; }
  }
  return best.p || h.point.clone();
}
function ftin(m) { const t = Math.abs(m) * 39.3701, ft = Math.floor(t / 12), inch = t - ft * 12; return `${ft}'-${inch.toFixed(1)}"`; }
function addMeasure(a, b) {
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), lMat);
  mGroup.add(line); dot(a); dot(b);
  const el = document.createElement("div"); el.className = "mlabel";
  const dh = Math.hypot(b.x - a.x, b.z - a.z), dv = b.y - a.y;
  el.innerHTML = `${ftin(a.distanceTo(b))}<small>H ${ftin(dh)} · V ${ftin(dv)}</small>`;
  stage.appendChild(el);
  measures.push({ a, b, el, line });
}
function updateMeasureLabels() {
  const scale = camera.position.distanceTo(controls.target) * .006;
  mGroup.children.forEach(o => o.userData.dot && o.scale.setScalar(scale)); hover.scale.setScalar(scale * 1.3);
  for (const m of measures) {
    const s = toScreen(m.a.clone().add(m.b).multiplyScalar(.5));
    m.el.style.display = s.z < 1 ? "block" : "none"; m.el.style.left = s.x + "px"; m.el.style.top = s.y + "px";
  }
}
function clearMeasures() { measures.forEach(m => m.el.remove()); measures.length = 0; mGroup.clear(); pending = null; }
document.getElementById("mClear").onclick = clearMeasures;

let downAt = null, moveT = 0;
cv.addEventListener("pointerdown", e => { downAt = { x: e.clientX, y: e.clientY, b: e.button }; });
cv.addEventListener("pointerup", e => {
  if (!downAt || downAt.b !== 0 || Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 5) return;
  const h = raycastAt(e.clientX, e.clientY);
  if (tool === "identify") pick(h?.object.userData.guid || null);
  else if (tool === "measure" && h) {
    const p = snapPoint(h, e.clientX, e.clientY);
    if (!pending) { pending = dot(p); }
    else { mGroup.remove(pending); addMeasure(pending.position.clone(), p); pending = null; }
  }
});
cv.addEventListener("pointermove", e => {
  if (tool !== "measure" || e.buttons || performance.now() - moveT < 30) return;
  moveT = performance.now();
  const h = raycastAt(e.clientX, e.clientY);
  hover.visible = !!h; if (h) hover.position.copy(snapPoint(h, e.clientX, e.clientY));
});
document.getElementById("type").onchange = e => { filters.type = e.target.value; applyFilters(); };
document.getElementById("q").oninput = e => { filters.q = e.target.value; applyFilters(); };
addEventListener("keydown", e => { if (e.target.tagName === "INPUT") return; if (e.key === "Escape") { if (pending) { mGroup.remove(pending); pending = null; } else if (picked) pick(null); else select(null); } if (e.key === "m") setTool("measure"); if (e.key === "i") setTool("identify"); if (e.key === "n") setTool("nav"); if ((e.key === "h" || e.key === "f") && home) flyTo(home.t, home.p); });

const index = await (await fetch("data/index.json")).json();
const sel = document.getElementById("project");
sel.innerHTML = index.map(p => `<option value="${p.slug}">${p.project} (${p.total})</option>`).join("");
sel.onchange = () => loadProject(sel.value);
loadProject(index[0].slug);
</script>
</body>
